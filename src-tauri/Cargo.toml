[package]
name = "localify"
version = "2.0.0"
description = "Lightweight local music player with synchronized lyrics, equalizer, and Discord Rich Presence"
authors = ["Alfiannr234"]
edition = "2021"

[lib]
name = "localify_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
cpal = "0.15"
souvlaki = "0.8"
walkdir = "2"
rayon = "1"
notify = "7"
notify-debouncer-mini = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
flate2 = "1"
base64 = "0.22"
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
